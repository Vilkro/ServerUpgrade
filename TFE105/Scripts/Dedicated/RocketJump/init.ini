  + "ScheduleScript(5.0, \"SayToClient(\"+cmd_strFirstExtra+\", \\\"^CServer\\\", \\\" \\\");\");\n"
  + "ScheduleScript(5.0, \"SayToClientLang(\"+cmd_strFirstExtra+\", \\\"^ced2675\\\", \\\"^cffff90Welcome to our server!\\\", \\\"^cffff90����� ���������� �� ��� ������!\\\");\");\n"
