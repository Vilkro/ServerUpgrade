// ─────────────────────────────────────────────────────────────────────────────
//  OnJoin — join announcement + delayed welcome to joiner
//
//  cmd_iJoinClient, cmd_strJoinName, cmd_strJoinIP are set by the patch
//  immediately before this script runs.
//
//  We capture them into cmd_strFirstExtra/SecondExtra/FourthExtra right away
//  because the next join event will overwrite them. The captured index is then
//  baked into the ScheduleScript string literal at call time, so each closure
//  targets the correct slot even if multiple players join in quick succession.
//
//  SayToAllExcept(slot, sender, msg) — sends to everyone except that slot.
//  SayToClient(slot, sender, msg)    — sends only to that slot.
// ─────────────────────────────────────────────────────────────────────────────

cmd_cmdOnJoin = cmd_cmdOnJoin
  + "if(1 == 1){"
      + "cmd_strFirstExtra  = (CTString)cmd_iJoinClient;"
      + "cmd_strSecondExtra = UndecorateString(cmd_strJoinName);"
      + "cmd_strFourthExtra = cmd_strJoinIP;"
    + "}\n"
