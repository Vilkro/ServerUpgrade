// ─────────────────────────────────────────────────────────────────────────────
//  @ping — show the engine-measured RTT to the requesting client.
//
//  GetClientPing(slot) reads CPlayerBuffer::plb_iPing and writes into
//  cmd_fPingResult.  That is the ping value the in-game HUD already shows.
//
//  Note: cmd_iChatClient holds the SESSION SLOT (1–8).
//  The engine starts numbering session slots at 1; slot 0 is the server itself.
// ─────────────────────────────────────────────────────────────────────────────
 
cmd_cmdOnChat = cmd_cmdOnChat
  + "if(cmd_strChatMessage == \"@ping\"){"
	  + "SayToClientLang(cmd_iChatClient, \"^CServer\", \" \", \" \");"
      + "GetClientPing(cmd_iChatClient);"
	  + "GetNetworkPing(cmd_iChatClient);"
      + "if((INDEX)cmd_fPingResult >= 0){"
        + "SayToClientLang(cmd_iChatClient, \"^cffff\","
          + " \"^c00ff80Your game ping: ^c80ffff\" + (CTString)(INDEX)cmd_fPingResult + \" ms^r\","
          + " \"^c00ff80��� ������� ����: ^c80ffff\" + (CTString)(INDEX)cmd_fPingResult + \" ��^r\");"
      + "}\n"
	  + "if((INDEX)cmd_fNetPingResult >= 0){"
        + "SayToClientLang(cmd_iChatClient, \"^cffff\","
          + " \"^c00ff80Your network ping: ^c80ffff\" + (CTString)(INDEX)cmd_fNetPingResult + \" ms^r\","
          + " \"^c00ff80��� ������� ����: ^c80ffff\" + (CTString)(INDEX)cmd_fNetPingResult + \" ��^r\");"
      + "}\n"
      + "if((INDEX)cmd_fNetPingResult < 0){"
        + "SayToClientLang(cmd_iChatClient, \"^cffff\","
          + " \"^c00ff80Could not read your real ping, please try again^r\","
          + " \"^c00ff80�� ������� ���������� ������� ����, ��������� ������� ������^r\");"
      + "}\n"
    + "}\n";

// ─────────────────────────────────────────────────────────────────────────────
//  Auto demo recording — append to bottom of init.ini
//
//  Requires DemoManager.cpp compiled into Core.
//
//  Behaviour:
//   • Recording starts when the FIRST player joins.
//   • Every 120 s the rotation script fires:
//       – If players are online  -  stop + start a new segment
//       – If server is empty     -  stop and DON'T reschedule
//         (recording resumes automatically on the next join)
//   • On server shutdown DemoManager_Shutdown() stops recording from C++,
//     so no extra script is needed for that case.
// ─────────────────────────────────────────────────────────────────────────────

// cmd_strFifthExtra holds the self-rescheduling rotation body.
// It checks GetActivePlayerCount() each time it fires.
//
// Breakdown of what the string executes when ScheduleScript fires it:
//   StopDemoRec();
//   if (GetActivePlayerCount() > 0) {
//     StartDemoRec("auto");
//     ScheduleScript(120.0, cmd_strFifthExtra);   <- reschedule only if not empty
//   }

// Record by 5-minute segments
// 
// cmd_strFifthExtra = "StopDemoRec();"
//   + "if(GetActivePlayerCount() > 0){"
//       + "StartDemoRec(\"rocketjump\", \"auto\");"
//       + "ScheduleScript(300.0, cmd_strFifthExtra);"
//   + "}";

// Record the whole game until no player left at each new minute
// 
cmd_strFifthExtra = ""
  + "if(GetActivePlayerCount() < 1){"
      + "StopDemoRec();"
  + "}"
  + "if(GetActivePlayerCount() > 0){"
      + "ScheduleScript(60.0, cmd_strFifthExtra);"
  + "}";
  
// When the first player joins and nothing is recording yet:
//   1. Start a demo segment.
//   2. Arm the rotation timer.
// Subsequent joins while recording is already active are silently ignored
// because of the IsDemoRecording() guard.

cmd_cmdOnJoin = cmd_cmdOnJoin
  + "if(IsDemoRecording() == 0){"
      + "StartDemoRec(\"RocketJump\", \"auto\");"
      + "ScheduleScript(60.0, cmd_strFifthExtra);"
  + "}\n";
