// ─────────────────────────────────────────────────────────────────────────────
//  OnJoin — join announcement + delayed welcome to joiner
//
//  cmd_iJoinClient, cmd_strJoinName, cmd_strJoinIP are set by the patch
//  immediately before this script runs.
//
//  We capture them into cmd_strFirstExtra/SecondExtra/FourthExtra right away
//  because the next join event will overwrite them. The captured index is then
//  baked into the ScheduleScript string literal at call time, so each closure
//  targets the correct slot even if multiple players join in quick succession.
//
//  SayToAllExcept(slot, sender, msg) — sends to everyone except that slot.
//  SayToClient(slot, sender, msg)    — sends only to that slot.
// ─────────────────────────────────────────────────────────────────────────────

cmd_cmdOnJoin = cmd_cmdOnJoin
  + "if(1 == 1){"
      + "cmd_strFirstExtra  = (CTString)cmd_iJoinClient;"
      + "cmd_strSecondExtra = UndecorateString(cmd_strJoinName);"
      + "cmd_strFourthExtra = cmd_strJoinIP;"
    + "}\n"
  + "ScheduleScript(2.0, \"GetClientCountry(\"+cmd_strFirstExtra+\");if(cmd_strCountryResult==\\\"\\\"||cmd_strCountryResult==\\\"...\\\"){cmd_strCountryResult=\\\"somewhere\\\";}SayToAllExceptLang(\"+cmd_strFirstExtra+\", \\\"^ceeee\\\", \\\"^cffda59\"+cmd_strSecondExtra+\"^cffff90 from ^cffda59\\\"+cmd_strCountryResult+\\\"^cffff90 has joined the game\\\", \\\"^cffda59\"+cmd_strSecondExtra+\"^cffff90 из ^cffda59\\\"+cmd_strCountryResult+\\\"^cffff90 присоединился к игре\\\");\");\n"
  + "ScheduleScript(5.0, \"SayToClient(\"+cmd_strFirstExtra+\", \\\"^CServer\\\", \\\" \\\");\");\n"
  + "ScheduleScript(5.0, \"SayToClientLang(\"+cmd_strFirstExtra+\", \\\"^ced2675\\\", \\\"^cffff90Welcome to our server!\\\", \\\"^cffff90Добро пожаловать на наш сервер!\\\");\");\n"
  + "ScheduleScript(5.0, \"SayToClientLang(\"+cmd_strFirstExtra+\", \\\"^ced2675\\\", \\\"^cffff90This is not a regular coop\\\", \\\"^cffff90Это не обычный кооп\\\");\");\n"
  + "ScheduleScript(5.0, \"SayToClientLang(\"+cmd_strFirstExtra+\", \\\"^ced2675\\\", \\\"^cffff90Type ^cefefef@help ^cffff90to get commands list\\\", \\\"^cffff90Введите ^cefefef@help ^cffff90чтобы увидеть список команд\\\");\");\n";
  
// ─────────────────────────────────────────────────────────────────────────────
//  @locate — show player name + country/city to the requesting client only.
//
//  GetClientLocation(slot) writes into cmd_strGeoResult (global).
//  GetClientName(slot)     returns the player name as a CTString expression.
//
//  For each slot we:
//    1. Call GetClientLocation(N) -> sets cmd_strGeoResult
//    2. If cmd_strGeoResult != "" the slot is active, so get the name and print.
//
//  Output format:  "Dandy - Hamburg, Germany"
//                  "Val - Tokyo, Japan"
//                  "PlayerX - 1.2.3.4 (...)"   <- lookup still running
// ─────────────────────────────────────────────────────────────────────────────
 
cmd_cmdOnChat = cmd_cmdOnChat
  + "if(cmd_strChatMessage == \"@locate\"){"
	  + "SayToClientLang(cmd_iChatClient, \"^CServer\", \" \", \" \");"

      // Header
      + "SayToClientLang(cmd_iChatClient, \"^c00ff\", \"^c00ff80Player locations:\", \"^c00ff80Местоположения игроков:\");"

      // Slot 1
      + "GetClientLocation(1);"
      + "if(cmd_strGeoResult != \"\"){"
        + "SayToClient(cmd_iChatClient, \"^ced2675\","
          + " \"^cffda59\" + UndecorateString(GetClientName(1)) + \"^c888888 - ^cffff90\" + cmd_strGeoResult);"
      + "}\n"

      // Slot 2
      + "GetClientLocation(2);"
      + "if(cmd_strGeoResult != \"\"){"
        + "SayToClient(cmd_iChatClient, \"^ced2675\","
          + " \"^cffda59\" + UndecorateString(GetClientName(2)) + \"^c888888 - ^cffff90\" + cmd_strGeoResult);"
      + "}\n"

      // Slot 3
      + "GetClientLocation(3);"
      + "if(cmd_strGeoResult != \"\"){"
        + "SayToClient(cmd_iChatClient, \"^ced2675\","
          + " \"^cffda59\" + UndecorateString(GetClientName(3)) + \"^c888888 - ^cffff90\" + cmd_strGeoResult);"
      + "}\n"

      // Slot 4
      + "GetClientLocation(4);"
      + "if(cmd_strGeoResult != \"\"){"
        + "SayToClient(cmd_iChatClient, \"^ced2675\","
          + " \"^cffda59\" + UndecorateString(GetClientName(4)) + \"^c888888 - ^cffff90\" + cmd_strGeoResult);"
      + "}\n"

      // Slot 5
      + "GetClientLocation(5);"
      + "if(cmd_strGeoResult != \"\"){"
        + "SayToClient(cmd_iChatClient, \"^ced2675\","
          + " \"^cffda59\" + UndecorateString(GetClientName(5)) + \"^c888888 - ^cffff90\" + cmd_strGeoResult);"
      + "}\n"

      // Slot 6
      + "GetClientLocation(6);"
      + "if(cmd_strGeoResult != \"\"){"
        + "SayToClient(cmd_iChatClient, \"^ced2675\","
          + " \"^cffda59\" + UndecorateString(GetClientName(6)) + \"^c888888 - ^cffff90\" + cmd_strGeoResult);"
      + "}\n"

      // Slot 7
      + "GetClientLocation(7);"
      + "if(cmd_strGeoResult != \"\"){"
        + "SayToClient(cmd_iChatClient, \"^ced2675\","
