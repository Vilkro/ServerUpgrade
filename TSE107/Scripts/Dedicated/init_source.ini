// ─────────────────────────────────────────────────────────────────────────────
//  @ru / @en — toggle chat language preference (default is English).
//
//  SetLanguage(cmd_iChatClient, "ru"|"en") persists the choice via PlayerDB,
//  keyed by GUID, so it survives reconnects. The confirmation reply is sent
//  in the language just chosen.
//
//  Note: Cyrillic display requires the client-side font patch, so @ru is
//  meant for players who already have it installed.
