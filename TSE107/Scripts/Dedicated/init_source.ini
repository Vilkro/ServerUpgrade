// ─────────────────────────────────────────────────────────────────────────────
//  Auto demo recording — append to bottom of init.ini
//
//  Requires DemoManager.cpp compiled into Core.
//
//  Behaviour:
//   • Recording starts when the FIRST player joins.
//   • Every 120 s the rotation script fires:
//       – If players are online  -  stop + start a new segment
//       – If server is empty     -  stop and DON'T reschedule
//         (recording resumes automatically on the next join)
//   • On server shutdown DemoManager_Shutdown() stops recording from C++,
//     so no extra script is needed for that case.
// ─────────────────────────────────────────────────────────────────────────────

// cmd_strFifthExtra holds the self-rescheduling rotation body.
// It checks GetActivePlayerCount() each time it fires.
//
// Breakdown of what the string executes when ScheduleScript fires it:
//   StopDemoRec();
//   if (GetActivePlayerCount() > 0) {
//     StartDemoRec("auto");
//     ScheduleScript(120.0, cmd_strFifthExtra);   <- reschedule only if not empty
//   }

// Record by 5-minute segments
// 
// cmd_strFifthExtra = "StopDemoRec();"
//   + "if(GetActivePlayerCount() > 0){"
//       + "StartDemoRec(\"rocketjump\", \"auto\");"
//       + "ScheduleScript(300.0, cmd_strFifthExtra);"
//   + "}";

// Record the whole game until no player left at each new minute
// 
cmd_strFifthExtra = ""
  + "if(GetActivePlayerCount() < 1){"
      + "StopDemoRec();"
  + "}"
  + "if(GetActivePlayerCount() > 0){"
      + "ScheduleScript(60.0, cmd_strFifthExtra);"
  + "}";
  
// When the first player joins and nothing is recording yet:
//   1. Start a demo segment.
//   2. Arm the rotation timer.
// Subsequent joins while recording is already active are silently ignored
// because of the IsDemoRecording() guard.

cmd_cmdOnJoin = cmd_cmdOnJoin
  + "if(IsDemoRecording() == 0){"
      + "StartDemoRec(\"rocketjump\", \"auto\");"
      + "ScheduleScript(60.0, cmd_strFifthExtra);"
  + "}\n";

// ─────────────────────────────────────────────────────────────────────────────
//  Idle/AFK watcher — every hour, kick any client whose position is
//  byte-for-byte identical to their position one hour ago.
//
//  • First sample after a join only records a baseline — nobody is kicked
//    off the first hour, only from the second identical sample onward.
//  • Exact match, no tolerance, per your spec.
//  • An inactive slot resets its baseline so a later reconnect doesn't get
//    compared against a stale position from whoever was there before.
// ─────────────────────────────────────────────────────────────────────────────

cmd_tmIdleCheckInterval = 300;    // 5 min between samples    // 1111
cmd_tmIdleKickAfter     = 2700;   // 45 min motionless = kick // 1111

cmd_strIdleWatcherTick = ""
  + "GetClientPosition(1);"
  + "if(cmd_bPosValid == 1){"
      + "if(cmd_bHasPrevPos[1]==1 && cmd_fPosX==cmd_fPrevPosX[1] && cmd_fPosY==cmd_fPrevPosY[1] && cmd_fPosZ==cmd_fPrevPosZ[1] && cmd_fAngH==cmd_fPrevAngH[1] && cmd_fAngP==cmd_fPrevAngP[1] && cmd_fAngB==cmd_fPrevAngB[1]){"
          + "cmd_fIdleTime[1] = cmd_fIdleTime[1] + cmd_tmIdleCheckInterval;"
          + "if(cmd_fIdleTime[1] >= cmd_tmIdleKickAfter){"
              + "KickClientLang(1,\"\n^c45ffb8KICKED FOR INACTIVITY^r\",\"\n^c45ffb8Отключен за бездействие^r\");"
              + "cmd_fIdleTime[1] = 0;"
              + "cmd_bHasPrevPos[1] = 0;"
          + "}else{"
              + "cmd_fPrevPosX[1]=cmd_fPosX;cmd_fPrevPosY[1]=cmd_fPosY;cmd_fPrevPosZ[1]=cmd_fPosZ;cmd_fPrevAngH[1]=cmd_fAngH;cmd_fPrevAngP[1]=cmd_fAngP;cmd_fPrevAngB[1]=cmd_fAngB;cmd_bHasPrevPos[1]=1;"
          + "}\n"
      + "}else{"
          + "cmd_fIdleTime[1] = 0;"
